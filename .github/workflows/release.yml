name: Release astro-ascendant

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# id-token enables npm OIDC trusted publishing (configure the trusted
# publisher for astro-ascendant on npmjs.com first: repository
# astro-ascendant/ascendant-ts, workflow release.yml). This path needs no
# NPM_TOKEN: do not set one, at repo or org level. Any NODE_AUTH_TOKEN that
# reaches the publish step makes npm authenticate with it instead of
# exchanging the OIDC token, so an empty or expired token fails with
# ENEEDAUTH and the trusted publisher is never consulted. The npm upgrade
# below is required (trusted publishing needs npm >= 11.5.1; stock Node 22
# ships npm 10). contents: write lets the job create the GitHub Release for
# the tag.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package $PKG"; exit 1; }

      - name: Verify
        run: bun run check

      - name: Verify packed package
        run: bun run package:check

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      # TEMPORARY diagnostic: ask the registry why the OIDC exchange fails.
      - name: Diagnose npm OIDC
        run: |
          echo "npm $(npm --version) on node $(node --version)"
          echo "registry: $(npm config get registry)"
          echo "userconfig: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          if [ -f "${NPM_CONFIG_USERCONFIG:-/nonexistent}" ]; then
            echo "npmrc auth lines:"; grep -c "_authToken" "${NPM_CONFIG_USERCONFIG}" || true
          fi
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC: ACTIONS_ID_TOKEN_REQUEST_URL is NOT set"
            exit 0
          fi
          echo "OIDC: request url present"
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "OIDC: id token length ${#ID_TOKEN}"
          echo "--- claims npm matches on ---"
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"));
            for (const k of ["aud","sub","repository","repository_owner","workflow_ref","job_workflow_ref","ref","event_name","environment","runner_environment"]) {
              console.log(`${k}: ${JSON.stringify(claims[k])}`);
            }' "$ID_TOKEN"
          echo "--- exchange response ---"
          curl -sS -o /tmp/exchange.json -w "http %{http_code}\n" -X POST \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/astro-ascendant" \
            -H "Authorization: Bearer $ID_TOKEN"
          cat /tmp/exchange.json | sed 's/"token":"[^"]*"/"token":"<redacted>"/'

      # No NODE_AUTH_TOKEN here on purpose: the OIDC exchange is what
      # authenticates this publish. See the comment at the top of the file.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
